apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd # <<<< this must always be argocd.
  annotations:
    argocd.argoproj.io/managed-by-cluster-argocd: argocd
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
# Pre-deployment review checklist:
# - Read the upstream Helm chart docs before creating the app manifest.
# - Confirm whether the chart creates its own database, ingress, persistence,
#   controllers, or other stateful components that need explicit disabling.
# - Confirm the replica model is safe for the workload before enabling HA.
# - Prefer ARM64 scheduling on this cluster when the image supports it.
# - If AMD64 is required, keep the workload to a single replica and pin it to
#   the appropriate AMD64 node or node pool with affinity or selectors.
# - For PostgreSQL-backed apps, create the Vault secret path first, sync the
#   ExternalSecret, run the provisioner script, and only then sync the app.
# - Prefer the shared PostgreSQL instance unless isolation or performance
#   requirements justify a dedicated database.
spec:
  destination:
    namespace: whoami
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://harrytang.github.io/helm-charts/ # <<<< the helm chart repository (all apps should deploy from Helm charts)
      targetRevision: 0.1.2 # <<<< the version of the chart to deploy
      chart: whoami # <<<< the name of the chart to deploy
      helm:
        valueFiles:
          - $values/values/whoami/values.yaml # <<<< always use values/<app-name>/values.yaml for customization
    - repoURL: https://github.com/el-dragon-1/homelab_dklair.git # <<<< the git repository containing the values file
      targetRevision: HEAD
      ref: values
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true