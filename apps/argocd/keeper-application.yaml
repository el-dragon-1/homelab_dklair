apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keeper
  namespace: argocd
  annotations:
    argocd.argoproj.io/managed-by-cluster-argocd: argocd
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: keeper
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://github.com/el-dragon-1/homelab_dklair.git
      path: charts/keeper
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/values/keeper/values.yaml
    - repoURL: https://github.com/el-dragon-1/homelab_dklair.git
      targetRevision: HEAD
      ref: values
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
