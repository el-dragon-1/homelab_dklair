# Vault source path: homelab/aliasvault/postgresql
# Required properties at that path: username, password, database
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aliasvault-db
  namespace: aliasvault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aliasvault-db
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        postgres_password: "{{ .password }}"
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: homelab/aliasvault/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: homelab/aliasvault/postgresql
        property: password
    - secretKey: database
      remoteRef:
        key: homelab/aliasvault/postgresql
        property: database
