# Vault source path: homelab/baserow/app
# Required properties at that path: secret_key, jwt_signing_key
# Stable keys replace the chart's per-sync generated values (generateJwtSecret: false),
# so Argo CD syncs no longer invalidate sessions and API tokens.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: baserow-app
  namespace: baserow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: baserow-app
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        SECRET_KEY: "{{ .secret_key }}"
        BASEROW_JWT_SIGNING_KEY: "{{ .jwt_signing_key }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: homelab/baserow/app
        property: secret_key
    - secretKey: jwt_signing_key
      remoteRef:
        key: homelab/baserow/app
        property: jwt_signing_key
