# Vault source path: homelab/baserow/minio
# Required properties at that path: username, password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: baserow-minio-vault
  namespace: baserow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: baserow-minio-vault
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        root-user: "{{ .username }}"
        root-password: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: homelab/baserow/minio
        property: username
    - secretKey: password
      remoteRef:
        key: homelab/baserow/minio
        property: password
