# Vault source path: homelab/baserow/smtp
# Required properties at that path: username, password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: baserow-smtp
  namespace: baserow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: baserow-smtp
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        EMAIL_SMTP_USER: "{{ .username }}"
        EMAIL_SMTP_PASSWORD: "{{ .password }}"
        FROM_EMAIL: "{{ .username }}"
  data:
    - secretKey: username
      remoteRef:
        key: homelab/baserow/smtp
        property: username
    - secretKey: password
      remoteRef:
        key: homelab/baserow/smtp
        property: password
