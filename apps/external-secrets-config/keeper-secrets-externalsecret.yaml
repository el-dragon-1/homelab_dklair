# Vault paths:
# - homelab/keeper/postgresql: username, password, database
# - homelab/keeper/application: better_auth_secret, encryption_key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keeper-secrets
  namespace: keeper
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keeper-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_USER: "{{ .username }}"
        DATABASE_PASSWORD: "{{ .password }}"
        DATABASE_NAME: "{{ .database }}"
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@postgresql-rw.postgresql.svc.cluster.local:5432/{{ .database }}"
        BETTER_AUTH_SECRET: "{{ .better_auth_secret }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
  data:
    - secretKey: username
      remoteRef:
        key: homelab/keeper/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: homelab/keeper/postgresql
        property: password
    - secretKey: database
      remoteRef:
        key: homelab/keeper/postgresql
        property: database
    - secretKey: better_auth_secret
      remoteRef:
        key: homelab/keeper/application
        property: better_auth_secret
    - secretKey: encryption_key
      remoteRef:
        key: homelab/keeper/application
        property: encryption_key
