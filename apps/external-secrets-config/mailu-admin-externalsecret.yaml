# Vault source path: homelab/mailu/app
# Required properties at that path: admin-password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mailu-admin
  namespace: mailu
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mailu-admin
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        password: "{{ .adminPassword }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: homelab/mailu/app
        property: admin-password
