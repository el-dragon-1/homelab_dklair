# Vault source path: homelab/mailu/app
# Required properties at that path: secret-key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mailu-core-secrets
  namespace: mailu
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mailu-core-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        secret-key: "{{ .secretKey }}"
  data:
    - secretKey: secretKey
      remoteRef:
        key: homelab/mailu/app
        property: secret-key
