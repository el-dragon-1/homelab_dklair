# Vault source path: homelab/mailu/postgresql
# Required properties at that path: username, password, database
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mailu-db
  namespace: mailu
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mailu-db
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        database: "{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: homelab/mailu/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: homelab/mailu/postgresql
        property: password
    - secretKey: database
      remoteRef:
        key: homelab/mailu/postgresql
        property: database
