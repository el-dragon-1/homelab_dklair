# Vault source path: homelab/vaultwarden/admin
# Required property at that path: token
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultwarden-admin
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vaultwarden-admin
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        ADMIN_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: homelab/vaultwarden/admin
        property: token
