# Baserow values
# - Deploys via Traefik + cert-manager
# - Reuses shared PostgreSQL (CloudNativePG) instead of chart-managed Postgres
# - Pulls DB, SMTP, app signing keys and object-storage credentials from ExternalSecret-managed Secrets

global:
  baserow:
    domain: baserow.dklair.io
    # Use the same public host for UI and API to avoid split-DNS/proxy issues.
    backendDomain: baserow.dklair.io
    # Single-level subdomain so Cloudflare Universal SSL (*.dklair.io) covers it.
    objectsDomain: baserow-objects.dklair.io
    envFrom:
      - secretRef:
          name: baserow-db
      - secretRef:
          name: baserow-smtp
      # Stable SECRET_KEY/BASEROW_JWT_SIGNING_KEY from Vault (see generateJwtSecret below).
      - secretRef:
          name: baserow-app
      # Last envFrom source overrides the parent chart's generated AWS credentials.
      - secretRef:
          name: baserow-minio-vault

# The chart's generated keys live in a Helm hook Secret that Argo CD recreates on every
# sync, which invalidates all sessions; keys come from the baserow-app Secret instead.
generateJwtSecret: false

# Use existing PostgreSQL cluster, not chart-managed dependency.
postgresql:
  enabled: false

minio:
  persistence:
    # PVC is managed in apps/baserow/minio-pvc.yaml.
    existingClaim: baserow-minio-data
    size: 20Gi
  auth:
    existingSecret: baserow-minio-vault
    rootUserSecretKey: root-user
    rootPasswordSecretKey: root-password

# Provide external PostgreSQL connection details (non-secret values only).
backendConfigMap:
  DATABASE_HOST: postgresql-rw.postgresql.svc.cluster.local
  DATABASE_PORT: "5432"
  DATABASE_NAME: baserow
  EMAIL_SMTP: "true"
  EMAIL_SMTP_HOST: smtp.mail.me.com
  EMAIL_SMTP_PORT: "587"
  EMAIL_SMTP_USE_TLS: "true"
  # Run migrations at application startup to avoid Redis dependency in chart pre-sync hook.
  MIGRATE_ON_STARTUP: "true"

# Use cluster Traefik instead of bundled Caddy ingress controller.
caddy:
  enabled: false

ingress:
  enabled: false

# Disable chart migration hook job. It runs as a pre-sync hook and currently fails
# before Redis resources are created.
migration:
  enabled: false
