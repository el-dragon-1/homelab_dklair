image:
  repository: ghcr.io/linuxserver/calibre-web
  tag: version-0.6.26
  pullPolicy: IfNotPresent

env:
  TZ: America/New_York
  PUID: "1001"
  PGID: "1001"

initContainers:
  calibre-login-fix:
    image: ghcr.io/linuxserver/calibre-web:version-0.6.26
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
    args:
      - |
        set -eu
        if [ ! -f /config/app.db ]; then
          echo "app.db missing, skipping Calibre login fix"
          exit 0
        fi
        sqlite3 /config/app.db "UPDATE settings SET config_session=0, config_external_port=443, config_trustedhosts='calibre.dklair.io' WHERE id=1;"
    volumeMounts:
      - name: config
        mountPath: /config

service:
  main:
    ports:
      http:
        port: 8083

ingress:
  main:
    enabled: true
    ingressClassName: my-traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: calibre.dklair.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - calibre.dklair.io
        secretName: calibre-tls

persistence:
  config:
    enabled: true
    mountPath: /config
    accessMode: ReadWriteOnce
    size: 15Gi
    storageClass: longhorn
  books:
    enabled: true
    mountPath: /books
    accessMode: ReadWriteOnce
    size: 50Gi
    storageClass: longhorn
