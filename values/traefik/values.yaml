# Traefik values for adopting the existing default/my-traefik Helm release into Argo CD.
ingressClass:
  enabled: true
  isDefaultClass: true

deployment:
  replicas: 2

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowEmptyServices: true
  kubernetesIngress:
    enabled: true
    allowEmptyServices: true
    publishedService:
      enabled: true

service:
  type: LoadBalancer
  annotations:
    kube-vip.io/loadbalancerIPs: 192.168.4.100
  spec:
    loadBalancerIP: 192.168.4.100

env:
  - name: TRAEFIK_ACCESSLOG
    value: "true"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1
                - node2
                - eldragon

tolerations:
  - key: homelab.io/control-infra
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
